name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structure, links and publication safety
        env:
          # Optional repository secret: comma- or newline-separated customer
          # names that must never appear in the published skill.
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
        run: python scripts/validate_skill.py
