name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structure, links and publication safety
        env:
          # Optional repository secret: comma- or newline-separated customer
          # names that must never appear in the published skill. Not available to
          # pull requests from forks.
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
        run: |
          args="--strict"
          # Fork pull requests get no secrets, so the term check is skipped there.
          if [ -n "$BANNED_TERMS" ]; then args="$args --require-terms"; fi
          python scripts/validate_skill.py $args
